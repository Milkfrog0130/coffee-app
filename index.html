<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee NoteLM - Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #F5F1ED;
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }

        /* 掃描動畫 */
        .scan-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #D4A373, transparent);
            position: absolute;
            width: 100%;
            top: 0;
            z-index: 10;
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .focus-frame {
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        }

        .focus-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #D4A373;
            border-style: solid;
            z-index: 20;
        }

        .corner-tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-radius: 4px 0 0 0; }
        .corner-tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; border-radius: 0 4px 0 0; }
        .corner-bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; border-radius: 0 0 0 4px; }
        .corner-br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-radius: 0 0 4px 0; }

        .level-pill { transition: all 0.3s ease; }
        .active-level { background-color: #795548; color: white; }
    </style>
</head>
<body class="flex flex-col items-center justify-between py-8">

    <div class="z-30 bg-white/60 backdrop-blur-md p-1 rounded-full flex gap-1 border border-white/50">
        <button onclick="setLevel('初級')" id="btn-初級" class="level-pill active-level px-6 py-2 rounded-full text-sm font-medium">初級</button>
        <button onclick="setLevel('中級')" id="btn-中級" class="level-pill px-6 py-2 rounded-full text-sm font-medium text-gray-600">中級</button>
        <button onclick="setLevel('專業')" id="btn-專業" class="level-pill px-6 py-2 rounded-full text-sm font-medium text-gray-600">專業</button>
    </div>

    <div class="relative w-72 h-96 flex items-center justify-center z-10">
        <div class="focus-frame w-full h-full rounded-3xl relative overflow-hidden bg-black">
            <video id="video" autoplay playsinline muted class="w-full h-full object-cover"></video>
            
            <div class="scan-line"></div>
            
            <div class="absolute inset-0 bg-black/20 pointer-events-none"></div>

            <div class="focus-corner corner-tl"></div>
            <div class="focus-corner corner-tr"></div>
            <div class="focus-corner corner-bl"></div>
            <div class="focus-corner corner-br"></div>
        </div>
    </div>

    <div class="z-30 flex flex-col items-center gap-6 w-full px-8">
        <button onclick="simulateScan()" class="bg-[#795548] hover:bg-[#5D4037] text-white w-20 h-20 rounded-full flex items-center justify-center shadow-xl active:scale-95 transition-all">
            <div class="w-16 h-16 border-4 border-white/30 rounded-full flex items-center justify-center">
                <div class="w-12 h-12 bg-white rounded-full"></div>
            </div>
        </button>
        <p class="text-gray-500 text-sm font-light">點擊拍照自動解析</p>
    </div>

    <script>
        // 相機啟動邏輯
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                const videoElement = document.getElementById('video');
                videoElement.srcObject = stream;
            } catch (err) {
                console.error("相機啟動失敗:", err);
                // 這裡可以在 UI 上提示用戶權限問題
            }
        }

        window.addEventListener('load', startCamera);

        // ... (其餘 setLevel 和 simulateScan 的 JavaScript) ...
    </script>

    <script>
    // 註冊 Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('Service Worker 註冊成功！範圍:', reg.scope))
                .catch(err => console.log('Service Worker 註冊失敗:', err));
        });
    }
    
    // (原本啟動相機的 startCamera 等其他 function 放在這裡後面...)
    </script>

    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>

<script>
async function simulateScan() {
    const video = document.getElementById('video');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    
    // 1. 擷取相機目前的畫面
    canvas.getContext('2d').drawImage(video, 0, 0);
    const imageData = canvas.toDataURL('image/png');

    // 顯示「辨識中...」的提示
    document.getElementById('hint-text').innerText = "辨識中，請稍候...";

    // 2. 使用 Tesseract.js 辨識文字
    Tesseract.recognize(imageData, 'eng+chi_tra').then(({ data: { text } }) => {
        console.log("辨識結果:", text);
        matchCoffeeData(text); // 執行比對邏輯
    });
}

// 3. 比對你的 coffee_data.json
async function matchCoffeeData(scannedText) {
    const response = await fetch('/coffee_data.json'); // 讀取你 GitHub 上的資料庫 [cite: 5]
    const coffeeData = await response.json();
    
    // 簡單的關鍵字比對
    const result = coffeeData.find(item => 
        scannedText.includes(item.origin) || scannedText.includes(item.name)
    ) || coffeeData[0]; // 若沒對到，預設顯示第一個 (例如衣索比亞) [cite: 4]

    showModalWithData(result);
}

function showModalWithData(data) {
    const modal = document.getElementById('result-modal');
    const vibe = document.getElementById('result-vibe');
    const desc = document.getElementById('result-desc');

    // 根據你設定的「初級」內容顯示 [cite: 4]
    vibe.innerText = data.beginner.vibe; 
    desc.innerText = data.beginner.summary;

    modal.classList.remove('hidden');
    modal.classList.add('flex');
    document.getElementById('hint-text').innerHTML = "對準咖啡標籤<br>自動解析風味";
}
    </script>
    
</body>
</html>
